name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend contracts, lint, components and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run api:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  lint-and-test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: project28_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d project28_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PROJECT28_TEST_ADMIN_URL_FILE: .local/ci-admin-url
      PROJECT28_TEST_APP_URL_FILE: .local/ci-app-url
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install project (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src/ services/ tests/ scripts/ stubs/ migrations/ ml/asr/ app.py

      - name: Ruff format
        run: ruff format --check src/ services/ tests/ scripts/ stubs/ migrations/ ml/asr/ app.py

      - name: Strict application types
        run: mypy src/ services/ ml/asr/ app.py

      - name: Compile-check
        run: python -m compileall -q app.py src/ services/

      - name: Run unit and security tests
        run: |
          python scripts/prepare_ci_database.py
          pytest tests/unit/ tests/security/ tests/api/ tests/reviews/ tests/streaming/ tests/integration/test_postgresql_persistence.py -v --tb=short

  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit (advisory, does not fail CI)
        run: pip-audit -r requirements.txt --strict || true
