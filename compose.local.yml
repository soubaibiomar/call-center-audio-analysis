name: project28

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: project28
      POSTGRES_USER: project28
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${PROJECT28_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U project28 -d project28"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    mem_limit: 512m

  app:
    image: project28-app:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${PROJECT28_BASE_IMAGE:-python:3.12-slim}
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/calls.db
      DATABASE_URL_FILE: /run/secrets/database_url
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: "7860"
      GRADIO_TEMP_DIR: /tmp/gradio
      HF_HUB_CACHE: /home/appuser/.cache/huggingface/hub
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      LANGCHAIN_TRACING_V2: "false"
      GRADIO_ANALYTICS_ENABLED: "false"
    ports:
      - "127.0.0.1:${PROJECT28_APP_PORT:-7861}:7860"
    volumes:
      - app_data:/app/data
      - type: bind
        source: ${PROJECT28_HF_CACHE_DIR:?Set PROJECT28_HF_CACHE_DIR in .env.docker}
        target: /home/appuser/.cache/huggingface/hub
        read_only: true
    secrets:
      - database_url
    tmpfs:
      - /tmp:mode=1777,size=512m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 3g
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/', timeout=4).close()"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    restart: unless-stopped

secrets:
  database_url:
    file: ./.local/database_url
  postgres_password:
    file: ./.local/postgres_password

volumes:
  postgres_data:
  app_data:
