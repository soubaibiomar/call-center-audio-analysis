repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.8
    hooks:
      - id: ruff
        args: [--fix]
        exclude: '^docs/'
      - id: ruff-format
        exclude: '^docs/'

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .detect-secrets.baseline.json]
        exclude: '\.env\.example$'

  - repo: local
    hooks:
      - id: no-secrets-in-code
        name: Check for hardcoded API keys
        entry: python scripts/check_hardcoded_keys.py
        language: system
        pass_filenames: false
